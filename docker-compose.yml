# Local dev infrastructure. Bound to 127.0.0.1 only.
services:
  postgres:
    image: postgres:16-alpine
    container_name: wavely-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wavely_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wavely_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-wavely}
    # 5433: a system Postgres often owns 5432.
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-wavely_user} -d ${POSTGRES_DB:-wavely}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: wavely-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
